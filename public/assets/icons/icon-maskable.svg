<!--
  نسخهٔ maskable — اندروید آیکون را در قالب‌های مختلف (دایره، سنجاقک،
  مربع گرد) می‌بُرد. هر چیزی بیرون از دایرهٔ ۸۰٪ وسط ممکن است بریده شود،
  پس حرف کوچک‌تر و پس‌زمینه تا لبه پر است.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="رشن">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44403C"/>
      <stop offset="45%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="55%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#bg)"/>
  <text x="96" y="126" font-family="Tahoma, Arial, sans-serif" font-size="84" font-weight="bold"
        fill="url(#gold)" text-anchor="middle">ر</text>
</svg>
